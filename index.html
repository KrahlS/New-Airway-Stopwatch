<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airway Timer">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Airway Study Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one thumb-width column under a sticky monitor-style clock; phase tabs (Before / During / After / Summary);
   full-width tap targets; vitals colored the way the bedside monitor colors them. Dark-first for dim resus rooms. */
:root{
  --bg:#0A0E13; --surface:#121820; --raised:#1A222D; --line:#2A3544; --fg:#E8EEF5; --muted:#8B99AB;
  --accent:#A4B6FF; --accent-ink:#0A0E13; --accent-soft:rgba(164,182,255,.14);
  --hr:#4ADE80; --spo2:#3FD3EE; --bp:#D68CF8; --et:#F4D03F;
  --alert:#FF4B4B; --alert-soft:rgba(255,75,75,.18); --on-alert:#FFFFFF;
  --warn:#F5A623; --warn-soft:rgba(245,166,35,.15); --on-warn:#1A1204;
  --ok:#4ADE80; --scrim:rgba(3,6,10,.62);
  --sed:#F2C94C; --sed-ink:#1C1503; --sed-line:#F2C94C;
  --par:#E5484D; --par-ink:#FFFFFF; --par-line:#F0686C;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-cond:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF0F4; --surface:#FFFFFF; --raised:#F3F5F8; --line:#D3DAE3; --fg:#0D141C; --muted:#566377;
    --accent:#2F45C4; --accent-ink:#FFFFFF; --accent-soft:rgba(47,69,196,.10);
    --hr:#13803B; --spo2:#0B7490; --bp:#8E2FD9; --et:#8F6400;
    --alert:#D92020; --alert-soft:rgba(217,32,32,.10); --on-alert:#FFFFFF;
    --warn:#B45309; --warn-soft:rgba(180,83,9,.10); --on-warn:#FFFFFF;
    --ok:#13803B; --scrim:rgba(13,20,28,.45);
    --sed:#F5C518; --sed-ink:#1C1503; --sed-line:#9A7400;
    --par:#D92D32; --par-ink:#FFFFFF; --par-line:#C8262C;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF0F4; --surface:#FFFFFF; --raised:#F3F5F8; --line:#D3DAE3; --fg:#0D141C; --muted:#566377;
  --accent:#2F45C4; --accent-ink:#FFFFFF; --accent-soft:rgba(47,69,196,.10);
  --hr:#13803B; --spo2:#0B7490; --bp:#8E2FD9; --et:#8F6400;
  --alert:#D92020; --alert-soft:rgba(217,32,32,.10); --on-alert:#FFFFFF;
  --warn:#B45309; --warn-soft:rgba(180,83,9,.10); --on-warn:#FFFFFF;
  --ok:#13803B; --scrim:rgba(13,20,28,.45);
  --sed:#F5C518; --sed-ink:#1C1503; --sed-line:#9A7400;
  --par:#D92D32; --par-ink:#FFFFFF; --par-line:#C8262C;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-ui);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 140px}
body.has-abar .wrap{padding-bottom:230px}
.hint{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--raised);font-weight:600;font-size:16px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--alert);border-color:var(--alert);background:transparent}
.btn.big{width:100%;min-height:56px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.arm{background:var(--alert)!important;border-color:var(--alert)!important;color:var(--on-alert)!important}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:16px;line-height:1.15;display:inline-flex;flex-direction:column;align-items:center;justify-content:center}
.chip small{font-family:var(--font-mono);font-weight:500;font-size:11.5px;opacity:.8}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:14px;padding-block:10px 4px}
.brand .mark{width:46px;height:46px;flex:none;color:var(--accent)}
.brand h1{font:700 26px/1.05 var(--font-cond);letter-spacing:.01em}
.brand p{margin:2px 0 0;font:600 13px var(--font-cond);letter-spacing:.14em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.stl{display:flex;flex-direction:column;gap:8px}
.st{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:var(--r-sm);border:1.5px solid var(--line)}
.st b{display:block;font:700 18px var(--font-cond);letter-spacing:.04em}
.st small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.st .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.st.on{border-color:var(--accent);background:var(--accent-soft)}
.st.on .box{background:var(--accent);border-color:var(--accent)}
.st.on .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.resume b{display:block;font:700 18px var(--font-cond);letter-spacing:.03em;text-transform:uppercase}
.resume span{font-size:14px}
.resume .mono{margin-left:auto;font-size:22px;font-weight:700}
.crow{display:flex;align-items:stretch;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.crow-main{flex:1;min-width:0;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.crow-main b{font-weight:600}
.crow-s{font-size:14px;color:var(--muted)}
.crow-del{padding:0 14px;color:var(--muted);font-size:14px;font-weight:600;border-left:1px solid var(--line);border-radius:0 var(--r-sm) var(--r-sm) 0}
.list{display:flex;flex-direction:column;gap:8px}
.empty{margin:0;padding:16px;border:1.5px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow span{font-weight:600}
.foot{margin:24px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.nojs{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.nojs h1{font:700 24px var(--font-cond)}
.nojs p{margin:0;line-height:1.45}
.booterr{color:var(--alert);font-weight:600}
.studytag{display:inline-block;font:700 11px/1 var(--font-cond);letter-spacing:.1em;padding:4px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;vertical-align:middle}

/* ---------- case header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:560px;margin:0 auto;padding:8px 16px 0}
.hdr-row{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:6px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;font-weight:600;font-size:15px;color:var(--accent)}
.back svg{width:18px;height:18px}
.clockblk{text-align:center;min-width:0}
.sw{font-family:var(--font-mono);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sw-sub{margin-top:3px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-sub b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.status{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.status:empty{display:none}
.st-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.st-line .dot{width:9px;height:9px;border-radius:50%;background:var(--alert);flex:none}
.st-line.amber .dot{background:var(--warn)}
.st-line.done .dot{background:var(--ok)}
.st-line [data-tick]{font-family:var(--font-mono)}
.wake{font-size:12px;color:var(--warn);text-align:center;margin-top:4px}
.wake:empty{display:none}
.tabs{display:flex;margin-top:6px}
.tab{flex:1;padding:11px 2px 9px;border-bottom:3px solid transparent;font:600 14px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}

/* ---------- sections ---------- */
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:220px}
.sec:first-child{margin-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h2{font:700 15px var(--font-cond);letter-spacing:.09em;text-transform:uppercase}
.sec-h .tg{display:flex;gap:4px}
.sub-h{font:700 13px var(--font-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.note{padding:10px 12px;border-radius:var(--r-sm);font-size:14.5px;line-height:1.4;border:1px solid var(--line);background:var(--raised)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.alert{border-color:var(--alert);background:var(--alert-soft)}
.q{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.q .qt{margin:0;font-weight:600;line-height:1.35}
.step{display:inline-block;font:700 12px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.txt{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:600}
.txt input{min-height:46px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--raised);font-size:16px;font-weight:500;color:var(--fg);width:100%}
.next{margin-top:22px}

/* ---------- stopwatch events ---------- */
.evts{display:flex;flex-direction:column;gap:10px}
.evt{display:flex;align-items:center;gap:12px;width:100%;min-height:70px;padding:12px 14px 12px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);text-align:left}
.evt .lbl{flex:1;min-width:0;font:700 19px/1.15 var(--font-cond);text-transform:uppercase;letter-spacing:.03em}
.evt .lbl small{display:block;margin-top:3px;font:500 13.5px/1.3 var(--font-ui);text-transform:none;letter-spacing:0;color:var(--muted)}
.evt .go{flex:none;font:700 13px var(--font-cond);letter-spacing:.12em;padding:7px 10px;border-radius:8px;border:1.5px solid currentColor;color:var(--accent)}
.evt.ready{border-color:var(--accent)}
.evt.ready:active{background:var(--accent-soft)}
.evt.need{border-color:var(--warn)}
.evt.need .go{color:var(--warn)}
.evt.done{background:var(--raised);border-color:transparent}
.evt:disabled{opacity:.38;cursor:not-allowed}
.evt.start{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:92px}
.evt.start .lbl{font-size:24px}
.evt.start .lbl small{color:var(--accent-ink);opacity:.82}
.evt.start .go{color:var(--accent-ink)}
.startpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.startpair.one{grid-template-columns:1fr}
.startpair .evt{flex-direction:column;align-items:stretch;justify-content:space-between;gap:12px;min-height:122px}
.startpair .evt .go{align-self:flex-start}
.evt.start.drug-sed{background:var(--sed);border-color:var(--sed);color:var(--sed-ink)}
.evt.start.drug-par{background:var(--par);border-color:var(--par);color:var(--par-ink)}
.evt.start.drug-sed .lbl small,.evt.start.drug-sed .go{color:var(--sed-ink)}
.evt.start.drug-par .lbl small,.evt.start.drug-par .go{color:var(--par-ink)}
.evt.ready.drug-sed{border-color:var(--sed-line)} .evt.ready.drug-sed .go{color:var(--sed-line)}
.evt.ready.drug-par{border-color:var(--par-line)} .evt.ready.drug-par .go{color:var(--par-line)}
.dchip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:1px}
.dchip.sed{background:var(--sed)} .dchip.par{background:var(--par)}
.tp{flex:none;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;line-height:1.1}
.tp b{display:block;font-size:26px;font-weight:700}
.tp small{font-size:13px;color:var(--muted)}
.ed{flex:none;font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;align-self:stretch;display:flex;align-items:center}
.nomeds{display:flex;flex-direction:column;gap:6px}

/* ---------- counters ---------- */
.ctrs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.ctr{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:10px 0}
.ctr+.ctr{border-top:1px solid var(--line)}
.ctr .cl{font-weight:600;line-height:1.25;min-width:0}
.ctr .cl small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.ctr button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--raised);font:700 26px var(--font-mono)}
.ctr .n{min-width:2.2ch;text-align:center;font:700 30px var(--font-mono)}

/* ---------- vitals ---------- */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vital{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0;--vc:var(--fg)}
.vital.wide{grid-column:1/-1}
.vital.k-hr{--vc:var(--hr)} .vital.k-spo2{--vc:var(--spo2)} .vital.k-bp{--vc:var(--bp)} .vital.k-et{--vc:var(--et)}
.vl{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.vl b{font:700 15px var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--vc)}
.vl .u{font-size:12px;color:var(--muted)}
.na{margin-left:auto;flex:none;min-height:30px;padding:2px 9px;border-radius:7px;border:1.5px solid var(--line);font:700 12px var(--font-cond);letter-spacing:.08em;color:var(--muted)}
.na.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.vin{width:100%;min-width:0;min-height:50px;font:700 26px var(--font-mono);font-variant-numeric:tabular-nums;background:var(--raised);border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--vc)}
.vin::placeholder{color:var(--muted);opacity:.5}
.vin.bad{border-color:var(--alert);background:var(--alert-soft)}
.vin:disabled{opacity:.3}
.vital.is-na .vin{display:none}
.vital .natext{display:none;font:700 22px var(--font-mono);color:var(--muted);min-height:50px;align-items:center}
.vital.is-na .natext{display:flex}
.bp{display:flex;align-items:center;gap:4px}
.bp .vin{font-size:22px;padding:6px 5px;text-align:center}
.bp .slash{font:700 22px var(--font-mono);color:var(--muted)}
.vlabel{font-size:12.5px;color:var(--muted)}
.monhint{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.monhint i{font-style:normal;font-weight:700}

/* lowest trackers + readings */
.lowrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lowv{min-width:84px}
.lowv b{display:block;font:700 34px/1 var(--font-mono);color:var(--vc)}
.lowv small{font-size:12.5px;color:var(--muted)}
.lowadd{flex:1;display:flex;gap:8px;min-width:170px}
.lowadd .vin{flex:1}
.readings{display:flex;flex-wrap:wrap;gap:6px}
.readings:empty{display:none}
.rd{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font:600 14px var(--font-mono)}
.rd small{font-weight:500;font-size:11.5px;color:var(--muted)}
.rd.fixed{padding-right:10px}
.rd.low{border-color:var(--vc)}
.rd button{min-width:30px;height:30px;border-radius:999px;color:var(--muted);font-size:16px;font-weight:700;padding:0 8px}
.rd button.arm{font-size:12px}
.win{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--warn);background:var(--warn-soft);font-size:14px;font-variant-numeric:tabular-nums}
.win b{font-size:15px}
.win.closed{border-color:var(--line);background:var(--raised)}
.win [data-tick]{font-family:var(--font-mono);font-weight:700}

/* IQI post-intubation */
.anchor{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--raised)}
.anchor .lbl{flex:1;font-weight:600;line-height:1.3}
.anchor .lbl small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.due{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.due b{font:700 22px var(--font-mono);color:var(--fg)}
.ivt{display:flex;flex-direction:column;gap:8px}
.iv{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:grid;grid-template-columns:28px 1fr auto;gap:6px 10px;align-items:center;background:var(--surface)}
.iv-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--font-mono);background:var(--raised)}
.iv-lbl{font:700 13px var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.iv-rng{font:700 17px var(--font-mono);font-variant-numeric:tabular-nums}
.iv-val{text-align:right;font:700 20px var(--font-mono);color:var(--bp);line-height:1.1}
.iv-val small{display:block;font-size:13px;color:var(--hr)}
.iv-val.none{color:var(--muted);font-size:16px}
.iv-more{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.iv-act{display:flex;gap:8px;flex-wrap:wrap}
.iv-act .btn{min-height:40px;padding:6px 12px;font-size:14px}
.iv.now{border-color:var(--alert);background:var(--alert-soft)}
.iv.now .iv-n{background:var(--alert);color:var(--on-alert)}
.iv.future{opacity:.62}
.iv.pending .iv-rng{color:var(--muted);font-size:15px}
.nowtag{display:inline-block;margin-left:6px;font:700 11px var(--font-cond);letter-spacing:.1em;color:var(--alert)}
.wave-stop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--alert-soft);border:1px solid var(--alert);font-weight:700}

<script>
(function(){

function fmtDur(sec){ if (sec < 0) sec = 0; var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + pad(s); }

function clone(o){ return JSON.parse(JSON.stringify(o)); }

var YN = ['Yes', 'No'];
var STUDIES = [
  { k: 'iqi',   name: 'IQI',   desc: 'Screening, RASS, baseline and RSI vitals, stopwatch steps, RSI meds, 5-min vitals, interval lows, post-intubation sedative' },
  { k: 'angle', name: 'ANGLE', desc: 'Live section only: clock times, entry counts, vitals at meds pushed, lowest SpO₂ and SBP to 2 min after tube, vasopressor' },

];
var RASS = [
  ['-5', 'No response to voice or physical stimulation'],
  ['-4', 'Responds to physical stimulation (but not to voice)'],
  ['-3', 'Responds to voice by moving or eye opening'],
  ['-2', 'Briefly awakens to voice, with eye contact < 10 sec'],
  ['-1', 'Not fully alert, but has eye contact > 10 sec'],

var ROUTES = ['IM', 'IV', 'IO'];

  { a: 300,  b: 600,  label: '5:00–10:00' },
  { a: 601,  b: 900,  label: '10:01–15:00' },
  { a: 901,  b: 1200, label: '15:01–20:00' },

  return c;

var S = { cases: {}, activeId: null, settings: { sound: true, theme: 'auto', last: { iqi: true, angle: false, wave: false } } };

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && d.cases) {

        S.settings = merge(clone(S.settings), d.settings || {});

  } catch (e) { storageOK = false; }

  ivCandidates(c, k).forEach(function(r){

  if (key.indexOf('bvm:') === 0) return 'BVM breath';

function alertDefs(c){

  var h = '<section class="sec" id="sec-sw"><div class="sec-h"><h2>Stopwatch</h2><span class="hint">Any order. Tap a recorded step to fix it.</span></div>' + eventsHTML(c) + '</section>';
  if (iqi) h += rsiMedsHTML(c);
  var cards = '';
  if (iqi || wave) cards += vitalCard(c, 'v.rsi.hr', 'hr');
  cards += vitalCard(c, 'v.rsi.spo2', 'spo2', { label: iqi || wave ? null : 'O\u2082 sat' });
  if (iqi || wave) cards += vitalCard(c, 'v.rsi.et', 'et');
  cards += vitalCard(c, 'v.rsi.bp', 'bp', { mode: iqi ? 'full' : 'sbp' });
  h += '<section class="sec" id="sec-rsiv"><div class="sec-h"><h2>Vitals as RSI meds pushed</h2>' + tagsFor(c, ['iqi', 'angle', 'wave']) + '</div>' +
    '<p class="hint">' + (c.noMeds ? 'No RSI meds were given. Use N/A where the study asks for values at meds pushed and none apply.' : 'Record as the RSI medications are pushed. Tap N/A if not available.') + (wave ? ' WAVE Step 1 uses these.' : '') + '</p>' +
    '<div class="vgrid">' + cards + '</div></section>';
  if (angle) h += angleHTML(c);
  if (iqi || angle) h += '<section class="sec" id="sec-counts"><div class="sec-h"><h2>Entries into the mouth</h2>' + tagsFor(c, ['iqi', 'angle']) + '</div><div class="ctrs">' +
    counter(c, 'blade', 'Laryngoscope blade') + counter(c, 'bougie', 'Bougie', '0 = not used') + counter(c, 'ett', 'Endotracheal tube') + '</div></section>';
  if (wave) h += waveConfirmHTML(c);
  if (iqi || wave) h += '<div class="next"><button class="btn big" data-act="tab" data-tab="after">Go to After tab</button></div>';
  return h;
}
function medBlock(c, key, title, drugs){
  var m = c.iqi[key];
  var h = '<div class="q"><p class="qt">' + title + '</p>' + chips(c, 'iqi.' + key + '.drug', drugs);
  if (m.drug && m.drug !== 'None') {
    h += '<div class="vgrid">' + '<label class="txt"><span>Dose (mg)</span><input class="vin" id="' + pid('iqi.' + key + '.dose') + '" data-bind="iqi.' + key + '.dose" data-kind="dec" inputmode="decimal" autocomplete="off" placeholder="–" value="' + esc(m.dose) + '"></label></div>' +
      '<p class="hint">Route</p>' + chips(c, 'iqi.' + key + '.route', ROUTES);
  }
  return h + '</div>';
}
function rsiMedsHTML(c){
  var noneGiven = c.iqi.sed.drug === 'None' || c.iqi.par.drug === 'None';
  var both = !noneGiven && ((c.iqi.sed.drug && c.iqi.par.drug) || !!firstDrug(c));
  return '<section class="sec" id="sec-meds"><div class="sec-h"><h2>RSI medications</h2>' + tag('IQI') + '</div>' +
    medBlock(c, 'sed', 'Sedative', SEDATIVES) + medBlock(c, 'par', 'Paralytic', PARALYTICS) +
    (both ? q('Which drug was administered first?', c.firstAuto ? 'Filled in by the start button. Change it here if needed.' : '', chips(c, 'iqi.first', ['Sedative', 'Paralytic'])) : '') + '</section>';
}
function lowCard(c, key){
  var o = c.low[key], na = !!o.na, isS = key === 'spo2';
  var label = isS ? 'Lowest O₂ sat' : 'Lowest SBP';
  return '<div class="vital k-' + (isS ? 'spo2' : 'bp') + (na ? ' is-na' : '') + '">' +
    '<div class="vl"><b>' + label + '</b><span class="u">' + (isS ? '%' : 'mmHg') + '</span><button class="na' + (na ? ' on' : '') + '" data-act="na" data-path="low.' + key + '" aria-pressed="' + na + '" aria-label="' + label + ' not available">N/A</button></div>' +
    '<div class="natext">N/A</div>' +
    (na ? '' : '<div class="lowrow"><div class="lowv" data-derive="lowv-' + key + '"></div><div class="lowadd">' +
      '<input class="vin" id="low-' + key + '" data-kind="int" data-max="' + (isS ? 100 : 300) + '" data-enter="lowAdd" data-key="' + key + '" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Reading" aria-label="' + label + ' reading" enterkeyhint="done">' +
      '<button class="btn" data-act="lowAdd" data-key="' + key + '">Log</button></div></div>' +
      '<div class="readings" data-derive="lowr-' + key + '"></div>') +
    '</div>';
}
function angleHTML(c){
  return '<section class="sec" id="sec-angle"><div class="sec-h"><h2>Lowest values</h2>' + tag('ANGLE') + '</div>' +
    '<p class="hint">Between RSI meds and 2 min after the tube is placed. Log each low reading you see; the lowest is kept. The value at meds pushed counts automatically.</p>' +
    '<div data-derive="win"></div>' + lowCard(c, 'spo2') + lowCard(c, 'sbp') +
    q('Vasopressor bolused or dose increased prior to (or with) meds?', '', chips(c, 'angle.vasoPre', YN)) +
    q('Vasopressor bolused or dose increased after RSI meds?', '', chips(c, 'angle.vasoPost', YN)) + '</section>';
}

/* ---------- AFTER ---------- */

  var a = anchor(c), R = ivRanges(c);
  var h = '<section class="sec" id="sec-iqi-post"><div class="sec-h"><h2>Post-intubation vitals</h2>' + tag('IQI') + '</div>';
  if (!a) {
    h += note(c.ev.tube == null
      ? 'Times appear once the tube is placed and the first BVM breath after placement is logged on the During tab.'
      : 'Tube placed. Waiting for the first BVM breath after tube placement (During tab).', 'warn');
  } else {
    h += '<div class="anchor"><span class="lbl">First BVM after tube<small>All times below count from this breath</small></span>' + timePair(c, a.t) + '</div>';
  }
  h += '<div class="sub-h">5 minutes after intubation</div>' +
    '<div class="due">Stopwatch time (BVM + 5:00) <b>' + (R ? fmtSW(R[0].s) : '--:--') + '</b>' + (R ? '<span>at ' + fmtClock(R[0].ts) + '</span>' : '') + '</div>' +
    '<div class="monhint"><span><i style="color:var(--hr)">HR</i> green value</span><span><i style="color:var(--spo2)">SpO₂</i> blue value</span><span><i style="color:var(--bp)">BP</i> purple values</span><span><i style="color:var(--et)">EtCO₂</i> bottom yellow value</span></div>' +
    '<div class="vgrid">' + vitalCard(c, 'v.five.hr', 'hr') + vitalCard(c, 'v.five.spo2', 'spo2') + vitalCard(c, 'v.five.et', 'et') + vitalCard(c, 'v.five.bp', 'bp', { mode: 'full' }) + '</div>';
  h += '<div class="sub-h">Lowest SBP and matching HR by interval</div>' +
    '<p class="hint">Log each BP you see with the HR at the same moment. The lowest SBP per interval is picked for you; the 5-min vitals count toward interval 1. Use N/A if vitals were unavailable for the whole interval.</p>' +
    (R ? '<button class="btn primary big" data-act="ivAdd">Add BP reading</button>' : '') +
    '<div class="ivt" data-derive="ivtable"></div></section>';
  return h;
}
function postSedHTML(c){
  var p = c.iqi.post, s = startSec(c);
  var h = '<section class="sec" id="sec-postsed"><div class="sec-h"><h2>First sedative after intubation</h2>' + tag('IQI') + '</div>' +
    '<p class="hint">Record only the first sedative given after successful intubation.</p>' +
    '<div class="chips"><button class="chip' + (p.none ? ' on' : '') + '" data-act="flag" data-path="iqi.post.none" aria-pressed="' + p.none + '">No sedative given after intubation</button></div>';
  if (!p.none) {
    h += p.t != null
      ? '<button class="evt done" data-act="editEvt" data-key="post"><span class="lbl">Sedative given</span>' + timePair(c, p.t) + '<span class="ed">Edit</span></button>'
      : '<button class="evt' + (s != null ? ' ready' : '') + '" data-act="postLog"' + (s != null ? '' : ' disabled') + '><span class="lbl">Sedative given<small>Logs the stopwatch time now</small></span><span class="go">TAP</span></button>';
    h += q('Medication', '', chips(c, 'iqi.post.drug', POST_SED)) +
      '<div class="vgrid">' + textIn(c, 'iqi.post.dose', 'First dose (mg)', 'dec') + textIn(c, 'iqi.post.rate', 'Initial infusion (mcg/kg/min)', 'dec') + '</div>';
  }
  return h + '</section>';
}
function whereWhy(c){
  var w = c.wave;
  return q('Where do you believe the original tube was located?', '', chips(c, 'wave.loc', ['In trachea', 'Not in trachea'])) +
    q('Why do you believe the tube was located there?', 'Select all that apply.', multiChips(c, 'wave.why', WHY) + (w.why.indexOf('Other') >= 0 ? textIn(c, 'wave.whyOther', 'Other') : ''));
}
var STOP = '<div class="wave-stop"><span>STOP</span>Step 5 complete</div>';
function waveConfirmHTML(c){
  var w = c.wave;
  return '<section class="sec" id="sec-wave"><div class="sec-h"><h2>CO₂ confirmation</h2>' + tag('WAVE') + '</div>' +
    q('<span class="step">Step 2</span>Waveform capnography after 7 breaths', 'Ask clinician #1: Is the waveform consistent with a tube located in the trachea?', chips(c, 'wave.s2', YN) + (w.s2 === 'No' ? textIn(c, 'wave.s2o', 'If No, what was observed?') : '')) +
    q('<span class="step">Step 3</span>Colorimetric detector after 7 breaths', 'Ask clinician #2: Is the color change consistent with a tube located in the trachea?', chips(c, 'wave.s3', YN) + (w.s3 === 'No' ? textIn(c, 'wave.s3o', 'If No, what was observed?') : '')) +
    '<div class="q"><p class="qt"><span class="step">Step 4</span>After intubation</p><div class="vgrid">' +
      vitalCard(c, 'v.waveEt', 'et', { label: 'EtCO₂', sub: 'after 7 breaths' }) +
      vitalCard(c, 'v.waveSbp', 'bp', { mode: 'sbp', label: '1st SBP', sub: 'after procedure' }) + '</div>' +
      '<p class="qt">Was the patient receiving CPR when CO₂ was interpreted (during Steps 2 and 3)?</p>' + chips(c, 'wave.cpr', YN) + '</div></section>';
}
function waveStep5HTML(c){
  var w = c.wave;
  var h = '<section class="sec" id="sec-wave5"><div class="sec-h"><h2>Step 5 · Confirm with clinician</h2>' + tag('WAVE') + '</div><div data-derive="wave20"></div>';
  h += q('1. Mechanical ventilation effective through original tube?', 'For 5 consecutive ventilations, measured exhaled volume ≥ 80% of delivered tidal volume.', chips(c, 'wave.q1', YN));
  if (w.q1 === 'Yes') h += STOP;
  if (w.q1 === 'No') {
    h += q('2. Original tube removed within 20 min?', '', chips(c, 'wave.q2', YN));
    if (w.q2 === 'Yes') h += whereWhy(c) + STOP;
    if (w.q2 === 'No') {
      h += q('3. Death or ongoing CPR at 20 min?', '', chips(c, 'wave.q3', YN));
      if (w.q3 === 'Yes') h += whereWhy(c) + STOP;
      if (w.q3 === 'No') { h += q('4. Patient alive AND original tube is not removed at 20 min?', '', chips(c, 'wave.q4', ['Yes'])); if (w.q4 === 'Yes') h += STOP; }
    }
  }
  h += '<div class="q"><p class="qt">Information sheet given</p><div class="chips"><button class="chip' + (w.info === 'Yes' ? ' on' : '') + '" data-act="set" data-path="wave.info" data-val="Yes" aria-pressed="' + (w.info === 'Yes') + '">Yes</button></div>' + textIn(c, 'wave.initials', 'Initials') + '</div>';
  return h + '</section>';
}
function afterHTML(c){
  var h = '';
  if (c.studies.iqi) h += iqiPostHTML(c) + postSedHTML(c);
  if (c.studies.wave) h += waveStep5HTML(c);
  if (!c.studies.iqi && !c.studies.wave) h += '<section class="sec">' + note('ANGLE has no after-procedure items for interns. Everything is on the During tab.') + '</section>';
  h += '<div class="next"><button class="btn big" data-act="tab" data-tab="summary">Review summary</button></div>';
  return h;
}

/* =========================================================
   Derived (live-updating) fragments. Never contain inputs.
   ========================================================= */
var DERIVE = {};
DERIVE.status = function(c){
  var n = nowSec(), s = startSec(c);
  if (c.done) return '<div class="st-line done"><span class="dot"></span>Case finished</div>';
  if (s == null) return '';
  var L = [];
  if (c.studies.iqi) {
    var a = anchor(c);
    if (!a) { if (c.ev.tube != null) L.push(['', 'IQI: waiting for first BVM after tube']); }
    else {
      var cur = currentIv(c, n), R = ivRanges(c);
      if (cur === -2) L.push(['', '5-min vitals at ' + fmtSW(R[0].s) + ' · in <span data-tick="cd" data-due="' + (a.t + 300) + '"></span>']);
      else if (cur >= 0 && cur < 5) L.push(['', 'Interval ' + (cur + 1) + ' of 5 · ' + fmtSW(R[cur].s) + '–' + fmtSW(R[cur].e) + ' · ends in <span data-tick="cd" data-due="' + (R[cur].te + 1) + '"></span>']);
      else L.push(['done', 'IQI intervals complete']);
    }
  }
  if (c.studies.angle && c.ev.tube != null && n < c.ev.tube + 120) L.push(['amber', 'ANGLE window closes in <span data-tick="cd" data-due="' + (c.ev.tube + 120) + '"></span>']);
  if (c.studies.wave && c.ev.tube != null && n < c.ev.tube + 1200) L.push(['amber', 'WAVE 20-min mark in <span data-tick="cd" data-due="' + (c.ev.tube + 1200) + '"></span>']);
  return L.map(function(l){ return '<div class="st-line ' + l[0] + '"><span class="dot"></span><span>' + l[1] + '</span></div>'; }).join('');
};
DERIVE.win = function(c){
  var n = nowSec(), s = startSec(c);
  if (s == null) return '<div class="win closed"><b>Window not open</b><span>Opens when the stopwatch starts.</span></div>';
  if (c.ev.tube == null) return '<div class="win"><b>Window open</b><span>Since ' + (c.noMeds ? 'blade entry' : 'RSI meds') + ' at ' + fmtClock(s) + '. Closes 2:00 after the tube is placed.</span></div>';
  var W = c.ev.tube + 120;
  if (n < W) return '<div class="win"><b>Window open · <span data-tick="cd" data-due="' + W + '"></span> left</b><span>Closes at ' + fmtClock(W) + ' (SW ' + fmtSW(W - s) + ')</span></div>';
  return '<div class="win closed"><b>Window closed</b><span>' + fmtClock(s) + ' to ' + fmtClock(W) + ' (SW ' + fmtSW(0) + ' to ' + fmtSW(W - s) + ')</span></div>';
};
function lowv(key){ return function(c){
  var low = lowLowest(c, key);
  return '<b>' + (low ? esc(low.v) : '–') + '</b><small>' + (low ? (low.src === 'rsi' ? 'at meds pushed' : 'logged at ' + fmtSW(sw(c, low.t))) : 'no readings yet') + '</small>';
}; }
function lowr(key){ return function(c){
  var low = lowLowest(c, key);
  return lowCandidates(c, key).map(function(r){
    var isLow = low && r.src === low.src && r.i === low.i;
    if (r.src === 'rsi') return '<span class="rd fixed' + (isLow ? ' low' : '') + '">' + esc(r.v) + '<small>meds pushed</small></span>';
    return '<span class="rd' + (isLow ? ' low' : '') + '">' + esc(r.v) + '<small>' + fmtSW(sw(c, r.t)) + '</small><button data-act="lowDel" data-key="' + key + '" data-i="' + r.i + '" data-confirm="1" aria-label="Remove reading ' + esc(r.v) + '">×</button></span>';
  }).join('');
}; }
DERIVE['lowv-spo2'] = lowv('spo2'); DERIVE['lowv-sbp'] = lowv('sbp');
DERIVE['lowr-spo2'] = lowr('spo2'); DERIVE['lowr-sbp'] = lowr('sbp');
DERIVE.ivtable = function(c){
  var R = ivRanges(c), cur = currentIv(c);
  return IV.map(function(x, k){
    var st = !R ? 'pending' : cur === k ? 'now' : (cur === 5 || cur > k) ? 'past' : 'future';
    var low = ivLowest(c, k), na = c.iv[k].na;
    var val = na ? '<div class="iv-val none">N/A</div>'
      : low ? '<div class="iv-val">' + esc(low.s) + '/' + esc(low.d || '?') + '<small>HR ' + esc(low.hr || '?') + '</small></div>'
      : '<div class="iv-val none">–</div>';
    var rds = ivCandidates(c, k).map(function(r){
      var isLow = low && r.src === low.src && r.i === low.i;
      var txt = esc(r.s) + '/' + esc(r.d || '?') + ' · ' + esc(r.hr || '?');
      if (r.src === 'five') return '<span class="rd fixed' + (isLow ? ' low' : '') + '" style="--vc:var(--bp)">' + txt + '<small>5-min vitals</small></span>';
      return '<span class="rd' + (isLow ? ' low' : '') + '" style="--vc:var(--bp)">' + txt + '<small>' + fmtSW(sw(c, r.t)) + '</small><button data-act="ivDel" data-k="' + k + '" data-i="' + r.i + '" data-confirm="1" aria-label="Remove reading">×</button></span>';
    }).join('');
    return '<div class="iv ' + st + '"><div class="iv-n">' + (k + 1) + '</div><div><div class="iv-lbl">' + x.label + ' after BVM' + (st === 'now' ? '<span class="nowtag">NOW · <span data-tick="cd" data-due="' + (R[k].te + 1) + '"></span> left</span>' : '') + '</div>' +
      '<div class="iv-rng">' + (R ? fmtSW(R[k].s) + '–' + fmtSW(R[k].e) : 'BVM + ' + x.label) + '</div></div>' + val +
      (R ? '<div class="iv-more">' + (rds ? '<div class="readings">' + rds + '</div>' : '') +
        '<div class="iv-act"><button class="btn" data-act="ivAdd" data-k="' + k + '">+ Reading</button><button class="btn' + (na ? ' primary' : '') + '" data-act="ivNa" data-k="' + k + '" aria-pressed="' + na + '">N/A for interval</button></div></div>' : '') +
      '</div>';
  }).join('');
};
DERIVE.wave20 = function(c){
  var n = nowSec(), s = startSec(c);
  if (c.ev.tube == null) return '<div class="win closed"><b>20-min mark</b><span>Counted from tube placement. Log the tube on the During tab.</span></div>';
  var D = c.ev.tube + 1200;
  return n < D
    ? '<div class="win"><b>20-min mark at ' + fmtClock(D) + ' · <span data-tick="cd" data-due="' + D + '"></span> left</b><span>SW ' + fmtSW(D - s) + ' (tube placed + 20:00)</span></div>'
    : '<div class="win closed"><b>20-min mark passed</b><span>' + fmtClock(D) + ' (SW ' + fmtSW(D - s) + ')</span></div>';
};
function refreshDerived(){
  var c = C();
  $$('[data-derive]').forEach(function(el){
    var k = el.getAttribute('data-derive'), fn = DERIVE[k]; if (!fn || !c) return;
    var html = fn(c);
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
  });
  tickNow();
}

/* =========================================================
   Summary
   ========================================================= */
function R_(k, v, o){
  o = o || {};
  var empty = v == null || v === '';
  return { k: k, v: empty ? (o.opt ? '–' : 'Missing') : String(v), miss: (empty && !o.opt) || !!o.miss, ref: !!o.ref };
}
function sv(o, unit){ if (o.na) return 'N/A'; return o.v === '' ? null : o.v + (unit || ''); }
function bpv(o, full){ if (o.na) return 'N/A'; if (o.s === '') return null; return full ? o.s + '/' + (o.d === '' ? '?' : o.d) : o.s; }
function bpRow(k, o, full){ var v = bpv(o, full); return R_(k, v == null || v === 'N/A' ? v : v + ' mmHg', { miss: full && v && v.indexOf('?') >= 0 }); }
function cntv(n){ return n == null ? null : String(n); }
function medv(m){
  if (!m.drug) return { v: null };
  if (m.drug === 'None') return { v: 'None' };
  return { v: m.drug + ' ' + (m.dose || '?') + ' mg ' + (m.route || '?'), miss: !m.dose || !m.route };
}
function vitRowsIQI(o){ return [R_('HR', sv(o.hr, ' bpm')), R_('EtCO₂', sv(o.et, ' mmHg')), bpRow('BP', o.bp, true), R_('SpO₂', sv(o.spo2, '%'))]; }
function summaryGroups(c){
  var G = [], s = startSec(c);
  function swt(t){ return t == null || s == null ? null : fmtSW(t - s); }
  function clk(t){ return t == null ? null : fmtClock(t); }
  if (c.studies.iqi) {
    var a = anchor(c), Rg = ivRanges(c);
    var pre = bvmSorted(c).filter(function(b){ return bvmStatus(c, b) === 'pre'; });
    var sed = medv(c.iqi.sed), par = medv(c.iqi.par);
    var both = c.iqi.sed.drug && c.iqi.sed.drug !== 'None' && c.iqi.par.drug && c.iqi.par.drug !== 'None';
    var p = c.iqi.post, postRows;
    if (p.none) postRows = [R_('Sedative after intubation', 'None given')];
    else postRows = [R_('Stopwatch time', swt(p.t)), R_('Medication', p.drug), R_('First dose', p.dose ? p.dose + ' mg' : null, { opt: !!p.rate }), R_('Initial infusion rate', p.rate ? p.rate + ' mcg/kg/min' : null, { opt: true })];
    G.push({ title: 'IQI', parts: [
      { title: 'Screening and inclusion', rows: [R_('Intubated for suspected intoxication', c.iqi.intox), R_('Airway management in stabilization room', c.iqi.incl)] },
      { title: 'RASS', rows: [R_('At stabilization room arrival', c.iqi.rassA), R_('Right before RSI', c.iqi.rassB)] },
      { title: 'Baseline vitals', rows: vitRowsIQI(c.v.base) },
      { title: 'RSI vitals (as meds pushed)', rows: vitRowsIQI(c.v.rsi) },
      { title: 'Stopwatch', rows: [
        R_('0:00', s == null ? null : (c.noMeds ? 'No RSI meds; blade entry at ' + fmtClock(s) : 'First RSI med' + (firstDrug(c) ? ' (' + firstDrug(c) + ')' : '') + ' pushed at ' + fmtClock(s))),
        R_('Blade enters mouth', swt(c.ev.bladeIn)),
        R_('Blade removed from mouth', swt(c.ev.bladeOut)),
        R_('First BVM breath (after tube)', a ? swt(a.t) : null)
      ].concat(c.push2 != null && otherDrug(c) ? [R_(otherDrug(c) + ' pushed (not on form)', swt(c.push2), { ref: true })] : [])
       .concat(pre.length ? [R_('BVM between attempts (not on form)', pre.map(function(b){ return swt(b.t); }).join(', '), { ref: true })] : [])
       .concat([R_('Tube placed (not on form)', swt(c.ev.tube), { opt: true, ref: true })]) },
      { title: 'Counts', rows: [R_('Laryngoscope blade entered mouth', cntv(c.counts.blade)), R_('Bougie entered mouth (0 = not used)', cntv(c.counts.bougie)), R_('Endotracheal tube entered mouth', cntv(c.counts.ett))] },
      { title: 'RSI medications', rows: [R_('Sedative', sed.v, { miss: sed.miss }), R_('Paralytic', par.v, { miss: par.miss })].concat(both ? [R_('Administered first', c.iqi.first)] : []) },
      { title: '5 min after intubation', rows: [R_('Stopwatch time (BVM + 5:00)', Rg ? fmtSW(Rg[0].s) : null), R_('HR', sv(c.v.five.hr, ' bpm')), R_('SpO₂', sv(c.v.five.spo2, '%')), bpRow('BP', c.v.five.bp, true), R_('EtCO₂', sv(c.v.five.et, ' mmHg'))] },

/* =========================================================
   Time parsing for the edit sheet
   ========================================================= */
function parseSW(str){
  str = (str || '').trim(); if (!str) return null;
  var p;
  if (str.indexOf(':') >= 0) {
    p = str.split(':').map(function(x){ return x === '' ? 0 : parseInt(x, 10); });
    if (p.some(isNaN)) return null;
    if (p.length === 2) { if (p[1] > 59) return null; return p[0] * 60 + p[1]; }
    if (p.length === 3) { if (p[1] > 59 || p[2] > 59) return null; return p[0] * 3600 + p[1] * 60 + p[2]; }
    return null;
  }
  if (!/^\d+$/.test(str)) return null;
  if (str.length <= 2) return parseInt(str, 10) > 59 ? null : parseInt(str, 10);
  var sec = parseInt(str.slice(-2), 10), min = parseInt(str.slice(0, -2), 10);
  if (sec > 59) return null;
  return min * 60 + sec;
}
function parseClock(str, base){
  str = (str || '').trim(); if (!str) return null;
  var h, m, s;
  if (str.indexOf(':') >= 0) {
    var p = str.split(':').map(function(x){ return parseInt(x, 10); });
    if (p.length < 2 || p.length > 3 || p.some(isNaN)) return null;
    h = p[0]; m = p[1]; s = p.length === 3 ? p[2] : 0;
  } else {
    if (!/^\d+$/.test(str)) return null;
    if (str.length === 6) { h = +str.slice(0, 2); m = +str.slice(2, 4); s = +str.slice(4, 6); }
    else if (str.length === 4) { h = +str.slice(0, 2); m = +str.slice(2, 4); s = 0; }
    else return null;
  }
  if (h > 23 || m > 59 || s > 59) return null;
  var d = new Date(base * 1000); d.setHours(h, m, s, 0);
  var t = Math.floor(d.getTime() / 1000);
  if (t - base > 43200) t -= 86400; else if (base - t > 43200) t += 86400;
  return t;
}

  /* BVM */
  bvm: function(){
    var c = C(); if (startSec(c) == null) return;
    var t = nowSec(), had = !!anchor(c);
    if (c.ev.tube != null && t >= c.ev.tube) { c.bvm.push({ t: t }); UI.sheet = null; commit((had ? 'BVM logged · ' : 'First BVM after tube · ') + fmtSW(sw(c, t))); }
    else { UI.sheet = { type: 'bvmAsk', t: t }; renderSheet(); }
  },
  bvmPost: function(){ var c = C(), t = UI.sheet && UI.sheet.t; if (t == null) return; c.bvm.push({ t: t, mode: 'post' }); UI.sheet = null; commit('BVM through the tube logged. Now log the tube time.'); },
  bvmPre: function(){ var c = C(), t = UI.sheet && UI.sheet.t; if (t == null) return; c.bvm.push({ t: t, mode: 'pre' }); UI.sheet = null; commit('BVM between attempts logged'); },
  bvmSheet: function(){ UI.sheet = { type: 'bvm' }; renderSheet(); },
  bvmToggle: function(el){ var c = C(), b = c.bvm[+el.dataset.i]; if (!b) return; b.mode = bvmStatus(c, b) === 'post' ? 'pre' : 'post'; commit(); },
  bvmDel: function(el){ var c = C(); c.bvm.splice(+el.dataset.i, 1); commit('BVM deleted'); },

  /* counts + fields */
  cnt: function(el){ var c = C(), k = el.dataset.k, d = +el.dataset.d, v = c.counts[k]; c.counts[k] = v == null ? (d > 0 ? 1 : 0) : Math.max(0, v + d); commit(); },
  set: function(el){ var c = C(), p = el.dataset.path, v = el.dataset.val; setp(c, p, get(c, p) === v ? '' : v); if (p === 'iqi.first') c.firstAuto = false; commit(); },
  rassSet: function(el){ var c = C(), p = el.dataset.path, v = el.dataset.val; setp(c, p, get(c, p) === v ? '' : v); UI.rassOpen[p] = false; commit(); },
  rassOpen: function(el){ UI.rassOpen[el.dataset.path] = true; render(); },
  toggleArr: function(el){ var c = C(), arr = get(c, el.dataset.path), v = el.dataset.val, i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); commit(); },
  flag: function(el){ var c = C(), p = el.dataset.path; setp(c, p, !get(c, p)); commit(); },
  na: function(el){ var c = C(), o = get(c, el.dataset.path); o.na = !o.na; commit(); },

  /* ANGLE lows */
  lowAdd: function(el){
    var c = C(), key = el.dataset.key, inp = $('#low-' + key); if (!inp) return;
    var v = inp.value.replace(/[^0-9]/g, ''); if (!v) { inp.focus(); return; }
    c.low[key].r.push({ v: v, t: nowSec() }); inp.value = ''; inp.classList.remove('bad');
    save(true); refreshDerived(); toast('Logged ' + v + (key === 'spo2' ? '%' : ' mmHg')); inp.focus();
  },
  lowDel: function(el){ var c = C(); c.low[el.dataset.key].r.splice(+el.dataset.i, 1); save(true); refreshDerived(); },

  /* IQI intervals */
  ivAdd: function(el){
    var c = C(); if (!ivRanges(c)) return;
    var k = el.dataset.k != null ? +el.dataset.k : currentIv(c);
    if (k < 0) k = 0; if (k > 4) k = 4;
    UI.sheet = { type: 'iv', k: k }; renderSheet();
    setTimeout(function(){ var i = $('#sh-s'); if (i) i.focus(); }, 50);
  },
  ivPick: function(el){ UI.sheet.k = +el.dataset.k; $$('.ivpick .chip').forEach(function(b){ var on = +b.dataset.k === UI.sheet.k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  ivSave: function(){
    var c = C(), k = UI.sheet.k;
    var sb = $('#sh-s').value.replace(/[^0-9]/g, ''), db = $('#sh-d').value.replace(/[^0-9]/g, ''), hr = $('#sh-hr').value.replace(/[^0-9]/g, '');
    if (!sb) { toast('Enter the systolic BP'); $('#sh-s').focus(); return; }
    c.iv[k].r.push({ s: sb, d: db, hr: hr, t: nowSec() }); c.iv[k].na = false; UI.sheet = null;
    commit('Saved to interval ' + (k + 1));
  },
  ivDel: function(el){ var c = C(); c.iv[+el.dataset.k].r.splice(+el.dataset.i, 1); save(true); refreshDerived(); },
  ivNa: function(el){ var c = C(), o = c.iv[+el.dataset.k]; o.na = !o.na; save(true); refreshDerived(); },

  /* post-intubation sedative */
  postLog: function(){ var c = C(); if (startSec(c) == null) return; var t = nowSec(); c.iqi.post.t = t; c.iqi.post.none = false; commit('Sedative logged · ' + fmtSW(sw(c, t))); },

  /* alerts */
  alertGo: function(){
    var a = UI.alert; UI.alert = null; if (!a || !a.go) { renderAlertBar(); return; }
    UI.view = 'case'; UI.tab = a.go.tab; render();
    var el = document.getElementById(a.go.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  alertX: function(){ UI.alert = null; renderAlertBar(); },

  /* summary */
  copy: function(){
    var c = C(), text = summaryText(c);
    var fallback = function(){ UI.sheet = { type: 'copy', text: text }; renderSheet(); var ta = $('#copytxt'); if (ta) { ta.focus(); ta.select(); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('Summary copied'); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  },
  selectCopy: function(){ var ta = $('#copytxt'); if (ta) { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } },
  finish: function(){ var c = C(); c.done = true; c.doneAt = nowSec(); UI.alert = null; UI.view = 'home'; commit('Case finished'); syncWake(); window.scrollTo(0, 0); },
  reopen: function(){ var c = C(); c.done = false; c.doneAt = null; commit('Case reopened'); syncWake(); }
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (el.dataset.confirm && !el.classList.contains('arm')) {
    $$('.arm').forEach(function(x){ if (x !== el) disarm(x); });
    el.classList.add('arm'); el._orig = el.innerHTML; el.innerHTML = 'Tap again';
    clearTimeout(el._t); el._t = setTimeout(function(){ disarm(el); }, 3000);
    return;
  }
  if (el.dataset.confirm) { clearTimeout(el._t); }
  fn(el, e);
});
function disarm(el){ if (!el.classList.contains('arm')) return; el.classList.remove('arm'); if (el._orig != null) el.innerHTML = el._orig; clearTimeout(el._t); }
document.addEventListener('input', function(e){
  var el = e.target, kind = el.dataset && el.dataset.kind; if (!kind) return;
  var v = el.value, nv = v;
  if (kind === 'int') nv = v.replace(/[^0-9]/g, '').slice(0, 3);
  else if (kind === 'dec') { nv = v.replace(/[^0-9.]/g, ''); var i = nv.indexOf('.'); if (i >= 0) nv = nv.slice(0, i + 1) + nv.slice(i + 1).replace(/\./g, ''); nv = nv.slice(0, 7); }
  else if (kind === 'time') nv = v.replace(/[^0-9:]/g, '').slice(0, 8);
  if (nv !== v) el.value = nv;
  if (el.dataset.max) el.classList.toggle('bad', nv !== '' && +nv > +el.dataset.max);
  var c = C();
  if (el.dataset.bind && c) { setp(c, el.dataset.bind, nv); save(); refreshDerived(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); var fn = ACT[e.target.dataset.enter]; if (fn) fn(e.target, e); }
  if (e.key === 'Escape' && UI.sheet) closeSheet();
});
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') write();
  else { syncWake(); tick(true); }
});
window.addEventListener('pagehide', write);

/* =========================================================
   Tick
   ========================================================= */
var lastSec = -1, lastSig = '';
function tickNow(){
  var n = nowSec(), c = C();
  $$('[data-tick]').forEach(function(el){
    var k = el.dataset.tick, txt = '';
    if (k === 'elapsed') { var s = c && startSec(c); txt = s != null ? fmtSW(((c.done && c.doneAt) ? c.doneAt : n) - s) : '00:00'; }
    else if (k === 'now') txt = fmtClock(n);
    else if (k === 'cd') txt = fmtDur(+el.dataset.due - n);
    else if (k === 'since') txt = fmtSW(n - (+el.dataset.from));
    if (el.textContent !== txt) el.textContent = txt;
  });
}
function phaseSig(c, n){
  var t = c.ev.tube;
  return [currentIv(c, n), t == null ? 'x' : n < t + 120, t == null ? 'x' : n < t + 1200, startSec(c) != null, c.done].join('|');
}
function tick(force){
  var n = nowSec(); if (n === lastSec && !force) return; lastSec = n;
  tickNow();
  var c = C();
  if (c) { var sig = phaseSig(c, n); if (sig !== lastSig || force) { lastSig = sig; refreshDerived(); } checkAlerts(); }
}

/* =========================================================
   Theme + boot
   ========================================================= */
var hostTheme = document.documentElement.getAttribute('data-theme'), themeSet = false;
function applyTheme(){
  var t = S.settings.theme, root = document.documentElement;
  if (t === 'dark' || t === 'light') {
    if (!themeSet) hostTheme = root.getAttribute('data-theme');
    root.setAttribute('data-theme', t); themeSet = true;
  } else if (themeSet) {
    if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme');
    themeSet = false;
  }
}
load();
applyTheme();
(function(){ var c = C(); if (c && !c.done && startSec(c) != null) { UI.view = 'case'; UI.tab = 'during'; } })();
render();
syncWake();
setInterval(tick, 250);
tick(true);
window.__airway = { S: S, UI: UI, anchor: anchor, ivRanges: ivRanges, currentIv: currentIv, summaryText: summaryText, warnings: warnings, parseSW: parseSW, parseClock: parseClock, render: render, tick: tick };
})();
</script>
